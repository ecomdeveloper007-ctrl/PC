<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Outer glowing rounded boundary -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="url(#glow-grad)" stroke-width="2.5" />
  
  <!-- Accent dot matrix element -->
  <circle cx="48" cy="16" r="3" fill="#10b981" />
  <circle cx="53" cy="21" r="1.5" fill="#34d399" opacity="0.8" />
  
  <!-- Bold modern Monogram PJ text -->
  <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">PJ</text>
  
  <!-- Underline spark -->
  <path d="M 18 48 Q 32 51 46 48" stroke="url(#glow-grad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
